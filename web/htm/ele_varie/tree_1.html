<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struttura albero fattura</title>
    <!-- Inclusione CSS e JS per jsTree -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="jsc/jstree.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #tree {
            margin: 20px;
            border: 1px solid #ddd;
            padding: 10px;
            width: 300px;
        }
    </style>
</head>
<body>

    <h1>Struttura ad albero della fattura</h1>
    <div id="tree"></div>

    <script>
        $(document).ready(function() {
            // Definisci la struttura dell'albero con i documenti
            $('#tree').jstree({
                'core': {
                    'data': [
                        {
                            "text": "Fattura #1234",
                            "state": { "opened": true },
                            "children": [
                                {
                                    "text": "Bolla di spedizione #5678",
                                    "children": [
                                        {
                                            "text": "Ordine di spedizione #9101",
                                            "children": [
                                                {
                                                    "text": "Ordine cliente #1121"
                                                }
                                            ]
                                        }
                                    ]
                                }
                            ]
                        }
                    ]
                }
            });
        });
    </script>

</body>
</html>
