<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.0/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="ele/css/ele.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.0/jquery-ui.js"></script>  
    <script>
        $(function() {
            // Applica il widget checkboxradio ai radio button
            $("input[type=radio]").checkboxradio();

            // Gestione dell'evento change per i radio button
            $("input[type=radio]").change(function() {
                // Ottieni il valore del radio selezionato
                let sel_val = $(this).val(); // Usa 'this' per il radio button cambiato
                let sel_nom = $(this).attr('name'); // Usa 'this' per il radio button cambiato

                // Mostra un alert con il valore selezionato
                console.log("Valore selezionato: " + sel_val + " - ID: " + sel_nom);

                // Aggiorna l'interfaccia per riflettere il cambio
                $("input[type=radio]").checkboxradio("refresh");
            });
        });
    </script>  
    <style>
        table {
            width: 60%;
            border-spacing: 3;
            border: 2px solid;
            border-radius: 5px;
            margin: 0 auto;
            background-color: white;
        }
        td {
            border: 1px solid;
            border-radius: 5px;
            padding: 6px;

</head>
