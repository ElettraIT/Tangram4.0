<!DOCTYPE html><html lang="en"><head>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<title>jQuery Simple Color</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="./ele_inv_color3.js"></script>

<script  type="text/javascript">
$(document).ready(function(){

  $('.simple_color_kitchen_sink').simpleColor({
    boxHeight: 40,
    cellWidth: 20,
    cellHeight: 20,
    chooserCSS: { 'border': '1px solid #660033' },
    displayCSS: { 'border': '1px solid red' },
    displayColorCode: true,
    livePreview: true,
    onSelect: function(hex, element) {
      console.log("You selected #" + hex + " for input #" + element.attr('class'));
    },
    onCellEnter: function(hex, element) {
      console.log("You just entered #" + hex + " for input #" + element.attr('class'));
    },
    onClose: function(element) {
      console.log("color chooser closed for input #" + element.attr('class'));
    }
  });

});
</script>
</head>

<body>

  <h3>Kitchen Sink</h3>
  <input class='simple_color_kitchen_sink' value='#993300'/>
</body>
</html>
