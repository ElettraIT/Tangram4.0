<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tachimetro</title>
    
    
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.0/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="ele/css/ele.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.0/jquery-ui.js"></script>  
    

    <script>
$(document).ready(function() {
    $('#aggiorna').on('click', function() {
        var min = parseFloat($('#min').val());
        var max = parseFloat($('#max').val());
        var attuale = parseFloat($('#attuale').val());
        
        // Verifica che il valore attuale sia compreso tra min e max
        if (attuale < min || attuale > max) {
            alert("Il valore attuale deve essere compreso tra " + min + " e " + max);
            return;
        }

        var range = max - min;
        var angolo = ((attuale - min) / range) * 180; // Mappa min-max a 0-180 gradi
        $('#indicatore').css('transform', 'rotate(' + (180 - angolo) + 'deg)');
    });
});
 </script>  


    <title>Tachimetro</title>


    <style>

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background-color: #f0f0f0;
}

.tachimetro {
    width: 300px;
    height: 150px;
    border: 10px solid #333;
    border-radius: 150px 150px 0 0;
    position: relative;
    overflow: hidden;
    margin-bottom: 20px;
}

.indicatore {
    position: absolute;
    width: 4px;
    height: 70px;
    background: red;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom;
    transform: rotate(0deg);
}

.centro {
    position: absolute;
    width: 20px;
    height: 20px;
    background: #333;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.controlli {
    display: flex;
    flex-direction: column;
    align-items: center;
}    </style>    


</head>
<body>
    <div class="tachimetro">
        <div class="indicatore" id="indicatore"></div>
        <div class="centro"></div>
    </div>
    <div class="controlli">
        <label for="min">Min:</label>
        <input type="number" id="min" value="0">
        <label for="max">Max:</label>
        <input type="number" id="max" value="200">
        <label for="attuale">Attuale:</label>
        <input type="number" id="attuale" value="0">
        <button id="aggiorna">Aggiorna</button>
    </div>

</body>
</html>
