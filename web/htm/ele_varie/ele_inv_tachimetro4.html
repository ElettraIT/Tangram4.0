<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustGage Example</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <style>
        .justgage-title {
            font-size: 96px !important;
            font-family: Arial, sans-serif !important;
        }
        .justgage-value {
            font-size: 96px !important;
            font-family: 'Courier New', monospace !important;
        }
        .justgage-label {
            font-size: 96px !important;
            font-family: 'Times New Roman', serif !important;
        }
    </style>
</head>
<body>

<div id="dialog" title="JustGage Example">
    <div id="gauge"></div>
</div>

    <script src="../../jsc_ele/jquery.min.js"></script>
    <script src="../../jsc_ele/jquery-ui.min.js"></script>
    <script src="../../jsc_ele/raphael.min.js"></script>
    <script src="../../jsc_ele/justgage.js"></script>

<script>
    $(function() {
        $("#dialog").dialog();
        var gage = new JustGage({
            id: "gauge",
            value: 60,
            min: 0,
            max: 100,
            title: "My Gauge",
            label: "Units",
            titleFontSize: 96,
            valueFontSize: 96,
            labelFontSize: 96,
        });
    });
</script>

</body>
</html>
