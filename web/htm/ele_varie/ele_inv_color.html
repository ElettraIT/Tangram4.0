<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker per TD</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<table border="1" width=80%>
    <tr>
        <td height='100' id='1'>Elemento 1</td>
        <td height='100' id='2'>Elemento 2</td>
        <td height='100' id='3'>Elemento 3</td>
    </tr>
    <tr>
        <td height='100' id='4'>Elemento 4</td>
        <td height='100' id='5'>Elemento 5</td>
        <td height='100' id='6'>Elemento 6</td>
    </tr>
</table>

<!-- Color picker invisibile -->
<input type="color" id="colorPicker" style="display:none;">

<script>
$(document).ready(function() {
    // Quando un td viene cliccato
    $('td').click(function() {
        var $td = $(this);  // riferimento al td selezionato
        $('#colorPicker').trigger('click'); // apre il color picker

        // Quando il colore viene scelto nel picker
        $('#colorPicker').change(function() {
            var selectedColor = $(this).val();  // ottieni il colore selezionato
            $td.css('background-color', selectedColor);  // cambia il colore di sfondo del td
        });
    });
});
</script>

</body>
</html>
