<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struttura albero fattura</title>
    <!-- Inclusione CSS e JS per jsTree -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css" />
    <!-- <link rel="stylesheet" href="css/jstree.css" /> -->
    <script src="jsc/jquery.min.js"></script>
    <script src="jsc/jstree.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #tree {
            margin: 20px;
            border: 1px solid #ddd;
            padding: 10px;
            width: 300px;
        }
    </style>
</head>
<body>

    <h1>Struttura ad albero della fattura</h1>
    <div id="tree"></div>

    <script>
        $(document).ready(function() {
            // Caricamento dinamico del file JSON
            $.getJSON("documenti.json", function(data) {
                // Creazione della struttura dell'albero a partire dal JSON
                $('#tree').jstree({
                    'core': {
                        'data': data
                    }
                });
            }).fail(function() {
                alert("Errore nel caricamento del file JSON.");
            });
        });
    </script>

</body>
</html>
