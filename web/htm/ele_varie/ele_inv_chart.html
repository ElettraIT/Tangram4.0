<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafico di prova 1</title>
    <script src="ele/jsc/jquery.min.js"></script>
    <script src="ele/jsc/chart.js"></script>
</head>
<body>
    <canvas id="myPieChart" width="200" height="200"></canvas>
    
    
    <style>
        canvas {
            width: 30%;
            border-spacing: 3;
            border: 2px solid;
            border-radius: 5px;
            margin: 0 auto;
            background-color: lightgrey;
        }
    </style>    
    
    
    
    
    <script>

$(document).ready(function() {
    // Dati da passare
    
    
       $("#myPieChart").width($(window).width()-100)
       $("#myPieChart").height($(window).height()-100)
    
    
    
    var labels = ['Spuntati', 'Senza Giacenza', 'Cazzata'];
    var data = [12000, 1500, 3000];
    
    var ctx = document.getElementById('myPieChart').getContext('2d');
    var myPieChart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: labels,
            datasets: [{
                data: data,
                backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56'],
                hoverBackgroundColor: ['#FF6384', '#36A2EB', '#FFCE56']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                },
                title: {
                    display: true,
                    text: 'Grafico a Torta Dinamico'
                }
            }
        }
    });
});
 </script>  

</body>
</html>
