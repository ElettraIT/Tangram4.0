<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.0/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="ele/css/ele.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.0/jquery-ui.js"></script>  
    

    <script>
$(document).ready(function() {
    $('#inputVelocita').on('input', function() {
        var velocita = $(this).val();
        var angolo = (velocita / 200) * 180; // Mappa 0-200 a 0-180 gradi
        $('#indicatore').css('transform', 'rotate(' + (180 - angolo) + 'deg)');
    });
});   

 </script>  


    <title>Tachimetro</title>


    <style>

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background-color: #f0f0f0;
}

.tachimetro {
    width: 300px;
    height: 150px;
    border: 10px solid #333;
    border-radius: 150px 150px 0 0;
    position: relative;
    overflow: hidden;
}

.indicatore {
    position: absolute;
    width: 4px;
    height: 70px;
    background: red;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom;
    transform: rotate(0deg);
}

.centro {
    position: absolute;
    width: 20px;
    height: 20px;
    background: #333;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

    </style>    





</head>
<body>
    <div class="tachimetro">
        <div class="indicatore" id="indicatore"></div>
        <div class="centro"></div>
    </div>
    <input type="range" id="inputVelocita" min="0" max="200" value="0">
</body>
</html>
