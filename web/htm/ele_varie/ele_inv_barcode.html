<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - Prove scansione</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<form>

<textarea id='qr-input' 
        name='qr-input' 
       class='inp_bcd' 
        rows='4' 
        cols='50'
   maxlength='460'></textarea>

<input type='number'
         id='qtv' 
       name='qtv'
      style='text-align:right;font-weight:bold;' 
      value='' 
        min='0' 
        max='999999'>

</form>

    <script>
        $(document).ready(function() {
            // Mantenere il focus sul campo di input
            $('#qr-input').focus();

            // Gestire l'evento di input
            $('#qr-input').on('input', function() {
                // Qui puoi gestire il valore in ingresso come desideri
                let value = $(this).val();
                // Fai qualcosa con il valore
                console.log(value);
            });


            $('#qr-input').on('keydown', function(event) {
                // Se necessario, puoi impedire l'uscita dal campo
                // Ad esempio, per gestire il tasto "Tab"
                if (event.key === 'Tab') {
                    event.preventDefault();
                    $(this).focus(); // Mantieni il focus
                }
            });

    /*====================================*/
    /* Accettazione testo Dati Barcode    */
    /*------------------------------------*/
    $('#qr-input').change(function()
    {

       alert("cambiato");

            });


        });
    </script>
</body>
</html>
