<!DOCTYPE html>
<html>
<head>
    <!-- *=================================* -->
    <!-- * Titolo                          * -->
    <!-- *=================================* -->
    <title>{ E L E T T R A }</title>
    <link rel='icon'
          type='image/x-icon'
          href='./icons/favicon.ico'
    />
    <!-- *=================================* -->
    <!-- * Stile                           * -->
    <!-- *=================================* -->
    <link rel="stylesheet" 
          type="text/css"
          href="css/ele.css"
    />
    <!-- *=================================* -->
    <!-- * Javascript                      * -->
    <!-- *=================================* -->
    <script src='./jsc_ele/jquery.min.js'></script>
    <script src='./jsc_ele/ele.js'></script>

    <!-- *=================================* -->
    <!-- * Stile                           * -->
    <!-- *=================================* -->

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center; /* Centra il testo nel corpo */
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center; /* Centra orizzontalmente le righe */
            gap: 20px; /* Spazio tra gli elementi */
            max-width: 1200px; /* Imposta una larghezza massima per il container */
            padding: 20px;
            box-sizing: border-box;
        }

        .item {
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centra verticalmente il contenuto */
            align-items: center; /* Centra orizzontalmente il contenuto */
            text-align: center;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 10px;
            box-sizing: border-box;
            flex: 1 1 calc(25% - 20px); /* Imposta la larghezza a un quarto del contenitore, meno lo spazio tra gli elementi */
            max-width: calc(25% - 20px); /* Imposta la larghezza massima a un quarto del contenitore, meno lo spazio tra gli elementi */
            min-height: 200px; /* Imposta un'altezza minima per mantenere uniformità */
        }

        /* Assicurati che l'immagine non superi l'altezza del contenitore */
        .item img {
            width: 100px; /* Larghezza dell'immagine */
            height: auto;
            display: block;
            margin: 0 auto 10px; /* Centra l'immagine e aggiunge spazio sotto di essa */
        }

        .item p {
            margin: 0; /* Rimuove il margine di default del paragrafo */
            font-size: 14px;
        }

        .logo img {
            width: 200px; /* Larghezza dell'immagine del logo */
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .copyright {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<!-- *=================================* -->
<!-- * Logo                            * -->
<!-- *=================================* -->
<div class="logo">
    <img src='./icons/logo-elettra.png' width='200' alt='Logo'>
</div>

<!-- *=================================* -->
<!-- * Menu                            * -->
<!-- *=================================* -->
<div class="container">
    <div class="item">
        <a href="/cgi-bin/elebfoB1">
            <img src="./icons/camion.png" alt="CARICO">
            <p>DOCUMENTI DI CARICO - bfo</p>
        </a>
    </div>
    <div class="item">
        <a href="/cgi-bin/elepro01">
            <img src="./icons/prodotto2.jpg" alt="PRODOTTO">
            <p>SCHEDA PRODOTTO - mag301</p>
        </a>
    </div>
    <div class="item">
        <a href="/cgi-bin/eleubi01">
            <img src="./icons/ubicazioni.jpg" alt="UBICAZIONI">
            <p>UBICAZIONI - SPOSTAMENTO PRODOTTI</p>
        </a>
    </div>
    <div class="item">
        <a href="/cgi-bin/eleodsB1">
            <img src="./icons/box.png" alt="SPEDIZIONI">
            <p>PREPARAZIONE SPEDIZIONI - ods</p>
        </a>
    </div>
    <div class="item">
        <a href="/cgi-bin/eleubi02">
            <img src="./icons/ubicazioni3.png" alt="UBICAZIONI">
            <p>UBICAZIONI - Situazione</p>
        </a>
    </div>
    <div class="item">
        <a href="/cgi-bin/elebol01">
            <img src="./icons/bol_cnf.png" alt="MERCE">
            <p>MERCE - Conferma uscita</p>
        </a>
    </div>
</div>

<!-- *=================================* -->
<!-- * Copyright                       * -->
<!-- *=================================* -->
<div class="copyright">
    <address>
        <font size=3>&copy; wip - TANGRAM</font>
    </address>
</div>

</body>
</html>
